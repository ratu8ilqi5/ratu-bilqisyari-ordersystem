<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order - Munchkin Munch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #F8FAFC; color: #0F172A; margin: 0; padding: 20px 12px; }
    .container { max-width: 480px; margin: 0 auto; }

    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-header h1 { font-size: 22px; font-weight: 800; margin: 0; }
    .brand-header p { font-size: 13px; color: #64748B; margin-top: 4px; }

    /* CARD GROUPING UXCEL STYLE */
    .card-group {
      background: #FFFFFF; border-radius: 16px; padding: 18px;
      margin-bottom: 14px; border: 1px solid #E2E8F0; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .card-title { font-size: 14px; font-weight: 800; color: #0F172A; margin-bottom: 14px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 700; color: #64748B; margin-bottom: 4px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; background: #F1F5F9; border: 1.5px solid transparent;
      border-radius: 10px; font-size: 13px; font-weight: 600; color: #0F172A; outline: none;
    }
    input:focus, select:focus, textarea:focus { background: #FFFFFF; border-color: #0F172A; }

    .btn-submit {
      width: 100%; padding: 14px; background: #0F172A; color: #FFFFFF;
      border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 12px rgba(15,23,42,0.15); transition: 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }

    #invoice-box { display: none; }
    .invoice-card { background: #FFFFFF; border-radius: 16px; padding: 20px; border: 1px solid #E2E8F0; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <h1>Munchkin Munch 🍪</h1>
      <p>Form Pemesanan Online</p>
    </div>

    <!-- FORM ORDER CUSTOMER -->
    <form id="order-form" onsubmit="submitOrder(event)">
      
      <!-- GROUP 1: ITEM INFO -->
      <div class="card-group">
        <div class="card-title">📦 Pilih Pesanan</div>
        <div class="form-group">
          <label>Pilih Produk</label>
          <select id="cust-product" required onchange="updateTotal()">
            <option value="">-- Memuat Produk --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jumlah (Qty)</label>
          <input type="number" id="cust-qty" value="1" min="1" required onchange="updateTotal()">
        </div>
        <div style="background:#F8FAFC; border-radius:10px; padding:10px; text-align:right; border:1px solid #E2E8F0; margin-top:10px;">
          <span style="font-size:10px; color:#64748B; font-weight:700;">TOTAL BAYAR:</span>
          <div style="font-size:18px; font-weight:800; color:#0F172A;" id="cust-total">Rp0</div>
        </div>
      </div>

      <!-- GROUP 2: PERSONAL INFO -->
      <div class="card-group">
        <div class="card-title">👤 Data Pemesan</div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="cust-name" placeholder="Masukkan nama kamu" required>
        </div>
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" id="cust-wa" placeholder="08xxxxxxxxxx" required>
        </div>
      </div>

      <!-- GROUP 3: DELIVERY INFO -->
      <div class="card-group">
        <div class="card-title">📍 Alamat Pengiriman</div>
        <div class="form-group">
          <label>Alamat Lengkap</label>
          <textarea id="cust-address" rows="3" placeholder="Jl. Mawar No. 12, RT 01/02..." required></textarea>
        </div>
        <div class="form-group">
          <label>Kode Pos</label>
          <input type="text" id="cust-postal" placeholder="12345">
        </div>
      </div>

      <button type="submit" class="btn-submit">Beli sekarang ✨</button>
    </form>

    <!-- INVOICE BOX -->
    <div id="invoice-box">
      <div class="invoice-card">
        <div style="font-size:32px;">📄</div>
        <h3 style="margin:6px 0;">Invoice Pemesanan</h3>
        <p style="font-size:12px; color:#64748B; margin-bottom:14px;">Munchkin Munch Official</p>
        <div id="invoice-details" style="text-align:left; background:#F8FAFC; padding:12px; border-radius:10px; border:1px solid #E2E8F0; font-size:13px; margin-bottom:14px;"></div>
        <p style="font-size:11px; color:#64748B;">Silakan selesaikan pembayaran sesuai instruksi Admin via WhatsApp. Terima kasih! ❤️</p>
      </div>
    </div>
  </div>
    <script>
    const SUPABASE_URL = "https://bygvlittjrnjidjnyuko.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5Z3ZsaXR0anJuamlkam55dWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzA5MzQsImV4cCI6MjEwMTE0NjkzNH0.OOEexyrNwfIkmrMdMW5kP9JabOWDHIeNJaFn4LdV87g";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productsList = [];

    window.onload = () => {
      if (window.location.hash.startsWith('#invoice-')) {
        showInvoice(window.location.hash.replace('#invoice-', ''));
      } else {
        loadProducts();
      }
    };

    async function loadProducts() {
      const { data } = await supabase.from('products').select('*').gt('stock', 0);
      productsList = data || [];
      const select = document.getElementById('cust-product');
      select.innerHTML = '<option value="">-- Pilih Produk --</option>';
      productsList.forEach(p => {
        select.innerHTML += `<option value="${p.id}" data-price="${p.price}">${p.name} - Rp${Number(p.price).toLocaleString('id-ID')}</option>`;
      });
    }

    function updateTotal() {
      const select = document.getElementById('cust-product');
      const opt = select.options[select.selectedIndex];
      const price = opt ? parseInt(opt.getAttribute('data-price') || 0) : 0;
      const qty = parseInt(document.getElementById('cust-qty').value) || 1;
      document.getElementById('cust-total').innerText = `Rp${(price * qty).toLocaleString('id-ID')}`;
    }

    async function submitOrder(e) {
      e.preventDefault();
      const productId = document.getElementById('cust-product').value;
      const qty = parseInt(document.getElementById('cust-qty').value);
      const name = document.getElementById('cust-name').value;
      const wa = document.getElementById('cust-wa').value;
      const address = document.getElementById('cust-address').value;
      const postal = document.getElementById('cust-postal').value;

      const prod = productsList.find(p => p.id === productId);
      if (!prod) return alert('Pilih produk terlebih dahulu!');

      const totalPrice = prod.price * qty;

      const { data, error } = await supabase.from('orders').insert([{
        product_id: productId, quantity: qty, customer_name: name,
        whatsapp: wa, address: address, postal_code: postal,
        total_price: totalPrice, status: 'pending'
      }]).select();

      if (!error && data.length > 0) {
        alert('Pesanan berhasil dibuat!');
        window.location.hash = `#invoice-${data[0].id}`;
        showInvoice(data[0].id);
      } else {
        alert('Gagal membuat pesanan: ' + error?.message);
      }
    }

    async function showInvoice(id) {
      document.getElementById('order-form').style.display = 'none';
      document.getElementById('invoice-box').style.display = 'block';
      const { data } = await supabase.from('orders').select('*, products(name)').eq('id', id).single();
      if (data) {
        document.getElementById('invoice-details').innerHTML = `
          <div><b>No. Order:</b> #${data.id.substring(0,8)}</div>
          <div><b>Nama:</b> ${data.customer_name}</div>
          <div><b>Item:</b> ${data.products?.name} (x${data.quantity})</div>
          <div><b>Total Tagihan:</b> Rp${Number(data.total_price).toLocaleString('id-ID')}</div>
          <div><b>Status:</b> <b style="color:${data.status === 'paid' ? 'green' : 'orange'}">${data.status.toUpperCase()}</b></div>
        `;
      }
    }
  </script>
</body>
</html>
