<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratu Bilqis Syar'i - Sistem Kelola Stok 👑</title>
    <!-- Google Fonts: Space Grotesk & VT323 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #2b2b2b;
            --panel-bg: #383838;
            --accent-color: #d4a373;
            --accent-hover: #c39262;
            --text-color: #f4f1de;
            --border-pixel: #1a1a1a;
            --danger-color: #e76f51;
            --success-color: #2a9d8f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 4px solid var(--border-pixel);
            box-shadow: 6px 6px 0px var(--border-pixel);
            padding: 20px;
        }

        /* Header Style */
        header {
            text-align: center;
            border-bottom: 4px dashed var(--border-pixel);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 3rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--border-pixel);
        }

        .subtitle {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        /* Navigation Buttons */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .pixel-btn {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            background-color: var(--accent-color);
            color: var(--border-pixel);
            border: 3px solid var(--border-pixel);
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-pixel);
            transition: all 0.1s ease;
        }

        .pixel-btn:hover {
            background-color: var(--accent-hover);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-pixel);
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-pixel);
        }

        .pixel-btn.active {
            background-color: var(--text-color);
            color: var(--border-pixel);
        }

        .pixel-btn.danger {
            background-color: var(--danger-color);
            color: #fff;
        }

        .pixel-btn.success {
            background-color: var(--success-color);
            color: #fff;
        }

        /* Views Content */
        .tab-view {
            display: none;
        }

        .tab-view.active {
            display: block;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 3px solid var(--border-pixel);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        /* Table Style */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 2px solid var(--border-pixel);
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: var(--border-pixel);
            color: var(--accent-color);
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
        }

        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .action-btns button {
            padding: 2px 8px;
            font-size: 1.1rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--bg-color);
            border: 3px solid var(--border-pixel);
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>RATU BILQIS SYAR'I 👑</h1>
            <p class="subtitle">Sistem Manajemen & Kelola Stok Produksi 🧵✨</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="pixel-btn active" onclick="switchTab('dashboard')">📊 DASHBOARD</button>
            <button class="pixel-btn" onclick="switchTab('kelola')">📦 KELOLA STOK</button>
            <button class="pixel-btn" onclick="switchTab('tambah')">➕ TAMBAH PRODUK</button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <div id="tab-dashboard" class="tab-view active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>TOTAL PRODUK 🛍️</h3>
                    <p id="stat-total-produk">0</p>
                </div>
                <div class="stat-card">
                    <h3>TOTAL STOK 🔢</h3>
                    <p id="stat-total-stok">0</p>
                </div>
                <div class="stat-card">
                    <h3>STOK MENIPIS ⚠️</h3>
                    <p id="stat-stok-tipis">0</p>
                </div>
            </div>
            <h2>Ringkasan Inventaris 📝</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NAMA PRODUK 👗</th>
                            <th>KATEGORI 🏷️</th>
                            <th>STOK 📦</th>
                            <th>STATUS 📌</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-table-body">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: KELOLA STOK -->
        <div id="tab-kelola" class="tab-view">
            <h2>Kelola Stok & Inventaris 📦</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NAMA PRODUK 👗</th>
                            <th>STOK 📦</th>
                            <th>AKSI PRODUKSI ⚡</th>
                            <th>HAPUS 🗑️</th>
                        </tr>
                    </thead>
                    <tbody id="kelola-table-body">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: TAMBAH PRODUK -->
        <div id="tab-tambah" class="tab-view">
            <h2>Tambah Produk Baru ➕</h2>
            <form id="form-tambah-produk" onsubmit="tambahProdukBaru(event)">
                <div class="form-group">
                    <label for="nama-produk">Nama Produk 👗:</label>
                    <input type="text" id="nama-produk" placeholder="Contoh: Abaya Premium Mocca" required>
                </div>
                <div class="form-group">
                    <label for="kategori-produk">Kategori 🏷️:</label>
                    <select id="kategori-produk" required>
                        <option value="Abaya">Abaya 👗</option>
                        <option value="Khimar">Khimar 🧕</option>
                        <option value="Gamis">Gamis 👘</option>
                        <option value="Aksesoris">Aksesoris ✨</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="stok-awal">Stok Awal 🔢:</label>
                    <input type="number" id="stok-awal" min="0" value="10" required>
                </div>
                <button type="submit" class="pixel-btn success">💾 SIMPAN PRODUK</button>
            </form>
        </div>
    </div>

    <script>
        // Data Stok Bawaan (Default Data)
        let dataStok = [
            { id: 1, nama: "Abaya Classic Black", kategori: "Abaya", stok: 15 },
            { id: 2, nama: "Khimar Soft Pad Caramel", kategori: "Khimar", stok: 8 },
            { id: 3, nama: "Gamis Terra Cotta", kategori: "Gamis", stok: 3 }
        ];

        // Fungsi Navigasi Tab
        function switchTab(tabName) {
            // Sembunyikan semua konten tab
            const allTabs = document.querySelectorAll('.tab-view');
            allTabs.forEach(tab => tab.classList.remove('active'));

            // Hapus status aktif dari semua tombol navigasi
            const allBtns = document.querySelectorAll('.nav-tabs .pixel-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));

            // Tampilkan tab yang dipilih
            const selectedTab = document.getElementById('tab-' + tabName);
            if(selectedTab) {
                selectedTab.classList.add('active');
            }

            // Aktifkan tombol yang diklik
            event.currentTarget.classList.add('active');

            // Refresh Tampilan Data
            renderApp();
        }

        // Fungsi Update / Render Seluruh Tampilan
        function renderApp() {
            renderDashboard();
            renderKelolaStok();
        }

        // Render Dashboard & Statistik
        function renderDashboard() {
            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '';

            let totalStok = 0;
            let stokTipis = 0;

            dataStok.forEach(item => {
                totalStok += item.stok;
                if(item.stok < 5) stokTipis++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.nama}</b></td>
                    <td>${item.kategori}</td>
                    <td>${item.stok} Pcs</td>
                    <td>${item.stok < 5 ? '🚨 Stok Menipis' : '✅ Aman'}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update Statistik Card
            document.getElementById('stat-total-produk').innerText = dataStok.length;
            document.getElementById('stat-total-stok').innerText = totalStok;
            document.getElementById('stat-stok-tipis').innerText = stokTipis;
        }

        // Render Tabel Kelola Stok
        function renderKelolaStok() {
            const tbody = document.getElementById('kelola-table-body');
            tbody.innerHTML = '';

            dataStok.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.nama}</b></td>
                    <td>${item.stok} Pcs</td>
                    <td>
                        <div class="action-btns">
                            <button class="pixel-btn" onclick="ubahStok(${item.id}, -1)">- ➖</button>
                            <button class="pixel-btn success" onclick="ubahStok(${item.id}, 1)">+ ➕</button>
                        </div>
                    </td>
                    <td>
                        <button class="pixel-btn danger" onclick="hapusProduk(${item.id})">🗑️ Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Fungsi Tambah / Kurang Stok
        function ubahStok(id, jumlah) {
            const produk = dataStok.find(p => p.id === id);
            if (produk) {
                if (produk.stok + jumlah < 0) {
                    alert("Stok tidak boleh kurang dari 0! ❌");
                    return;
                }
                produk.stok += jumlah;
                renderApp();
            }
        }

        // Fungsi Tambah Produk Baru
        function tambahProdukBaru(e) {
            e.preventDefault();
            const nama = document.getElementById('nama-produk').value;
            const kategori = document.getElementById('kategori-produk').value;
            const stok = parseInt(document.getElementById('stok-awal').value);

            const produkBaru = {
                id: Date.now(),
                nama: nama,
                kategori: kategori,
                stok: stok
            };

            dataStok.push(produkBaru);
            document.getElementById('form-tambah-produk').reset();
            
            alert("Produk berhasil ditambahkan! 🎉");
            switchTab('kelola'); // Langsung beralih ke halaman kelola stok
        }

        // Fungsi Hapus Produk
        function hapusProduk(id) {
            if (confirm("Apakah Anda yakin ingin menghapus produk ini? ❓")) {
                dataStok = dataStok.filter(p => p.id !== id);
                renderApp();
            }
        }

        // Jalankan saat pertama kali dibuka
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
