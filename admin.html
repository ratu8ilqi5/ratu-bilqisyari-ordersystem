<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratu Bilqis Syar'i - Sistem Kelola Stok 👑</title>
    <!-- Google Fonts: Space Grotesk & VT323 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #22252a;
            --panel-bg: #2d3139;
            --card-bg: #24272e;
            --accent-color: #d4a373;
            --accent-hover: #e0b080;
            --text-main: #f8f9fa;
            --text-muted: #a0aab8;
            --border-color: #3f4450;
            --border-radius-sm: 8px;
            --border-radius-lg: 14px;
            --danger-color: #e76f51;
            --danger-hover: #f47b5d;
            --success-color: #2a9d8f;
            --success-hover: #34b3a4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Header Style */
        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .pixel-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pixel-btn:hover {
            background-color: var(--border-color);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .pixel-btn.active {
            background-color: var(--accent-color);
            color: #1a1a1a;
            border-color: var(--accent-color);
        }

        .pixel-btn.danger {
            background-color: rgba(231, 111, 81, 0.15);
            color: var(--danger-color);
            border-color: rgba(231, 111, 81, 0.4);
        }

        .pixel-btn.danger:hover {
            background-color: var(--danger-color);
            color: #fff;
        }

        .pixel-btn.success {
            background-color: var(--success-color);
            color: #fff;
            border-color: var(--success-color);
        }

        .pixel-btn.success:hover {
            background-color: var(--success-hover);
        }

        /* Views Content */
        .tab-view {
            display: none;
        }

        .tab-view.active {
            display: block;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        /* Table Style */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.safe {
            background-color: rgba(42, 157, 143, 0.2);
            color: var(--success-color);
        }

        .status-badge.warning {
            background-color: rgba(231, 111, 81, 0.2);
            color: var(--danger-color);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .action-btns button {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: 20px;
            text-align: left;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card p {
            font-family: 'VT323', monospace;
            font-size: 2.8rem;
            color: var(--accent-color);
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>RATU BILQIS SYAR'I 👑</h1>
            <p class="subtitle">Sistem Manajemen & Kelola Stok Produksi 🧵✨</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="pixel-btn active" onclick="switchTab('dashboard', event)">📊 DASHBOARD</button>
            <button class="pixel-btn" onclick="switchTab('kelola', event)">📦 KELOLA STOK</button>
            <button class="pixel-btn" onclick="switchTab('tambah', event)">➕ TAMBAH PRODUK</button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <div id="tab-dashboard" class="tab-view active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>TOTAL PRODUK 🛍️</h3>
                    <p id="stat-total-produk">0</p>
                </div>
                <div class="stat-card">
                    <h3>TOTAL STOK 🔢</h3>
                    <p id="stat-total-stok">0</p>
                </div>
                <div class="stat-card">
                    <h3>STOK MENIPIS ⚠️</h3>
                    <p id="stat-stok-tipis">0</p>
                </div>
            </div>

            <h2 class="section-title">Ringkasan Inventaris 📝</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NAMA PRODUK 👗</th>
                            <th>KATEGORI 🏷️</th>
                            <th>STOK 📦</th>
                            <th>STATUS 📌</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-table-body">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: KELOLA STOK -->
        <div id="tab-kelola" class="tab-view">
            <h2 class="section-title">Kelola Stok & Inventaris 📦</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NAMA PRODUK 👗</th>
                            <th>STOK 📦</th>
                            <th>AKSI PRODUKSI ⚡</th>
                            <th>HAPUS 🗑️</th>
                        </tr>
                    </thead>
                    <tbody id="kelola-table-body">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: TAMBAH PRODUK -->
        <div id="tab-tambah" class="tab-view">
            <h2 class="section-title">Tambah Produk Baru ➕</h2>
            <form id="form-tambah-produk" onsubmit="tambahProdukBaru(event)">
                <div class="form-group">
                    <label for="nama-produk">Nama Produk 👗</label>
                    <input type="text" id="nama-produk" placeholder="Contoh: Abaya Premium Mocca" required>
                </div>
                <div class="form-group">
                    <label for="kategori-produk">Kategori 🏷️</label>
                    <select id="kategori-produk" required>
                        <option value="Abaya">Abaya 👗</option>
                        <option value="Khimar">Khimar 🧕</option>
                        <option value="Gamis">Gamis 👘</option>
                        <option value="Aksesoris">Aksesoris ✨</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="stok-awal">Stok Awal 🔢</label>
                    <input type="number" id="stok-awal" min="0" value="10" required>
                </div>
                <button type="submit" class="pixel-btn success" style="margin-top: 8px;">💾 SIMPAN PRODUK</button>
            </form>
        </div>
    </div>

    <script>
        // Data Stok Bawaan (Default Data)
        let dataStok = [
            { id: 1, nama: "Abaya Classic Black", kategori: "Abaya", stok: 15 },
            { id: 2, nama: "Khimar Soft Pad Caramel", kategori: "Khimar", stok: 8 },
            { id: 3, nama: "Gamis Terra Cotta", kategori: "Gamis", stok: 3 }
        ];

        // Fungsi Navigasi Tab
        function switchTab(tabName, event) {
            const allTabs = document.querySelectorAll('.tab-view');
            allTabs.forEach(tab => tab.classList.remove('active'));

            const allBtns = document.querySelectorAll('.nav-tabs .pixel-btn');
            allBtns.forEach(btn => btn.classList.remove('active'));

            const selectedTab = document.getElementById('tab-' + tabName);
            if(selectedTab) {
                selectedTab.classList.add('active');
            }

            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            renderApp();
        }

        // Fungsi Update / Render Seluruh Tampilan
        function renderApp() {
            renderDashboard();
            renderKelolaStok();
        }

        // Render Dashboard & Statistik
        function renderDashboard() {
            const tbody = document.getElementById('dashboard-table-body');
            tbody.innerHTML = '';

            let totalStok = 0;
            let stokTipis = 0;

            dataStok.forEach(item => {
                totalStok += item.stok;
                if(item.stok < 5) stokTipis++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.nama}</b></td>
                    <td>${item.kategori}</td>
                    <td><b>${item.stok}</b> Pcs</td>
                    <td>
                        <span class="status-badge ${item.stok < 5 ? 'warning' : 'safe'}">
                            ${item.stok < 5 ? '🚨 Stok Menipis' : '✅ Aman'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total-produk').innerText = dataStok.length;
            document.getElementById('stat-total-stok').innerText = totalStok;
            document.getElementById('stat-stok-tipis').innerText = stokTipis;
        }

        // Render Tabel Kelola Stok
        function renderKelolaStok() {
            const tbody = document.getElementById('kelola-table-body');
            tbody.innerHTML = '';

            dataStok.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.nama}</b></td>
                    <td><b>${item.stok}</b> Pcs</td>
                    <td>
                        <div class="action-btns">
                            <button class="pixel-btn" onclick="ubahStok(${item.id}, -1)">- ➖</button>
                            <button class="pixel-btn success" onclick="ubahStok(${item.id}, 1)">+ ➕</button>
                        </div>
                    </td>
                    <td>
                        <button class="pixel-btn danger" onclick="hapusProduk(${item.id})">🗑️ Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Fungsi Tambah / Kurang Stok
        function ubahStok(id, jumlah) {
            const produk = dataStok.find(p => p.id === id);
            if (produk) {
                if (produk.stok + jumlah < 0) {
                    alert("Stok tidak boleh kurang dari 0! ❌");
                    return;
                }
                produk.stok += jumlah;
                renderApp();
            }
        }

        // Fungsi Tambah Produk Baru
        function tambahProdukBaru(e) {
            e.preventDefault();
            const nama = document.getElementById('nama-produk').value;
            const kategori = document.getElementById('kategori-produk').value;
            const stok = parseInt(document.getElementById('stok-awal').value);

            const produkBaru = {
                id: Date.now(),
                nama: nama,
                kategori: kategori,
                stok: stok
            };

            dataStok.push(produkBaru);
            document.getElementById('form-tambah-produk').reset();
            
            alert("Produk berhasil ditambahkan! 🎉");
            
            // Pindah otomatis ke tab kelola stok
            const kelolaBtn = document.querySelectorAll('.nav-tabs .pixel-btn')[1];
            switchTab('kelola', { currentTarget: kelolaBtn });
        }

        // Fungsi Hapus Produk
        function hapusProduk(id) {
            if (confirm("Apakah Anda yakin ingin menghapus produk ini? ❓")) {
                dataStok = dataStok.filter(p => p.id !== id);
                renderApp();
            }
        }

        // Jalankan saat pertama kali dibuka
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
