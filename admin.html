<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Munchkin Munch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace, -apple-system, sans-serif; }
    body { background-color: #F3F0E6; color: #000000; margin: 0; padding: 20px 12px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    /* Y2K HEADER */
    .header { text-align: center; margin-bottom: 20px; background: #FFF; border: 2.5px solid #000; padding: 12px; box-shadow: 4px 4px 0px #000; border-radius: 12px; }
    .header h2 { margin: 0; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; }
    .header p { margin: 4px 0 0; font-size: 11px; font-weight: bold; color: #555; }

    /* MENU VERTIKAL Y2K NEO-BRUTALISM */
    .nav-vertical { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .nav-btn {
      width: 100%; background: #FFFFFF; border: 2.5px solid #000000;
      padding: 12px 14px; border-radius: 10px; font-weight: 800; font-size: 13px;
      color: #000000; text-align: left; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: all 0.1s ease; box-shadow: 3px 3px 0px #000000;
    }
    .nav-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000000; }
    .nav-btn.active {
      background: #FFE600; /* Y2K Yellow */
      border-color: #000000; box-shadow: 4px 4px 0px #000000;
    }

    /* CARD GROUPING NEO-BRUTALIST */
    .card-group {
      background: #FFFFFF; border-radius: 12px; padding: 16px;
      margin-bottom: 16px; border: 2.5px solid #000000; box-shadow: 4px 4px 0px #000000;
    }
    .card-title { font-size: 13px; font-weight: 900; margin-bottom: 12px; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 10px; font-weight: 900; color: #000; margin-bottom: 4px; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 10px; background: #FAF9F5; border: 2px solid #000;
      border-radius: 8px; font-size: 12px; font-weight: 700; color: #000; outline: none;
    }
    input:focus, select:focus { background: #FFF; border-color: #000; box-shadow: 2px 2px 0px #000; }

    /* BUTTONS NEO-BRUTALISM */
    .btn { width: 100%; padding: 10px; border: 2px solid #000; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 6px; box-shadow: 2px 2px 0px #000; transition: 0.1s; }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #000; }
    .btn-dark { background: #000000; color: #FFF; }
    .btn-green { background: #50E3C2; color: #000; } /* Y2K Mint/Green */
    .btn-wa { background: #25D366; color: #000; }
    .btn-light { background: #FAF9F5; color: #000; }

    /* BADGES */
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; border: 1.5px solid #000; text-transform: uppercase; }
    .badge-pending { background: #FFD166; color: #000; }
    .badge-paid { background: #06D6A0; color: #000; }

    /* METRIC GRID */
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-box { background: #FAF9F5; border-radius: 8px; padding: 10px; text-align: center; border: 2px solid #000; }
    .metric-val { font-size: 15px; font-weight: 900; color: #000; margin-top: 2px; }
    .metric-lbl { font-size: 9px; font-weight: 900; color: #000; text-transform: uppercase; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Control Center 🛠️</h2>
      <p>Dashboard Admin Munchkin Munch</p>
    </div>

    <!-- SUB MENU VERTIKAL CLEAN Y2K -->
    <div class="nav-vertical">
      <button class="nav-btn active" onclick="switchTab('orders', this)"><span>📋 Pesanan Masuk</span> <span>➔</span></button>
      <button class="nav-btn" onclick="switchTab('stock', this)"><span>📦 Kelola Stok Produk</span> <span>➔</span></button>
      <button class="nav-btn" onclick="switchTab('rekap', this)"><span>📊 Rekap Penjualan</span> <span>➔</span></button>
      <button class="nav-btn" onclick="switchTab('setting', this)"><span>⚙️ Setting Resi Thermal</span> <span>➔</span></button>
    </div>

    <!-- TAB 1: ORDERS -->
    <div id="tab-orders" class="tab-content active">
      <div class="card-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div class="card-title" style="margin:0;">📋 Filter Orders</div>
          <button class="btn btn-light" style="width:auto; padding:4px 10px; margin:0; font-size:10px;" onclick="fetchOrders()">🔄 Refresh</button>
        </div>
        <select id="filter-status" onchange="renderOrders()">
          <option value="ALL">Semua Status</option>
          <option value="pending">Pending (Menunggu Bayar)</option>
          <option value="paid">Paid (Sudah Lunas)</option>
        </select>
      </div>
      <div id="orders-list">Memuat pesanan...</div>
    </div>

    <!-- TAB 2: STOK -->
    <div id="tab-stock" class="tab-content">
      <div class="card-group">
        <div class="card-title">➕ Tambah Produk Baru</div>
        <div class="form-group"><label>Nama Produk</label><input type="text" id="new-name" placeholder="Contoh: Fudgy Brownies"></div>
        <div class="form-group"><label>Harga (Rp)</label><input type="number" id="new-price" placeholder="65000"></div>
        <div class="form-group"><label>Stok Awal</label><input type="number" id="new-stock" placeholder="10"></div>
        <button class="btn btn-green" onclick="addProduct()">Simpan Produk</button>
      </div>

      <div class="card-group">
        <div class="card-title">📦 Inventori Produk</div>
        <div id="stock-list">Memuat produk...</div>
      </div>
    </div>

    <!-- TAB 3: REKAP -->
    <div id="tab-rekap" class="tab-content">
      <div class="card-group">
        <div class="card-title">📊 Performa Penjualan</div>
        <div class="form-group">
          <label>Periode</label>
          <select id="rekap-filter" onchange="calculateRekap()">
            <option value="all">Semua Waktu</option>
            <option value="today">Hari Ini</option>
            <option value="week">7 Hari Terakhir</option>
            <option value="month">30 Hari Terakhir</option>
          </select>
        </div>
        <div class="metric-grid" style="margin-top:10px;">
          <div class="metric-box"><div class="metric-lbl">Total Omset</div><div class="metric-val" id="m-omset">Rp0</div></div>
          <div class="metric-box"><div class="metric-lbl">Pesanan Lunas</div><div class="metric-val" id="m-orders">0</div></div>
        </div>
        <div class="metric-grid" style="margin-top:8px;">
          <div class="metric-box"><div class="metric-lbl">Item Terjual</div><div class="metric-val" id="m-items">0 pcs</div></div>
          <div class="metric-box"><div class="metric-lbl">Pending Order</div><div class="metric-val" id="m-pending">0</div></div>
        </div>
      </div>
    </div>

    <!-- TAB 4: SETTING -->
    <div id="tab-setting" class="tab-content">
      <div class="card-group">
        <div class="card-title">🖨️ Thermal Printer Layout</div>
        <div class="form-group">
          <label>Ukuran Kertas</label>
          <select id="cfg-paper">
            <option value="80mm">80mm x 100mm (Standar Resi)</option>
            <option value="58mm">58mm (Struk Mini)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ukuran Font Alamat</label>
          <select id="cfg-font">
            <option value="normal">Standar Rapi</option>
            <option value="large">Besar Jelas (Kurir Friendly)</option>
          </select>
        </div>
      </div>

      <div class="card-group">
        <div class="card-title">🏪 Identitas Pengirim</div>
        <div class="form-group"><label>Nama Toko</label><input type="text" id="cfg-sender" value="Munchkin Munch"></div>
        <div class="form-group"><label>No. WA Toko</label><input type="text" id="cfg-phone" placeholder="08xxxxxxxxxx"></div>
        <div class="form-group"><label>Pesan Footer Resi</label><input type="text" id="cfg-footer" value="Terima kasih telah berbelanja! 🍪"></div>
        <button class="btn btn-green" onclick="saveSettings()">💾 Simpan Layout</button>
      </div>
    </div>
  </div>
    <script>
    const SUPABASE_URL = "https://bygvlittjrnjidjnyuko.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5Z3ZsaXR0anJuamlkam55dWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzA5MzQsImV4cCI6MjEwMTE0NjkzNH0.OOEexyrNwfIkmrMdMW5kP9JabOWDHIeNJaFn4LdV87g";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productsData = [], ordersData = [];

    window.onload = () => {
      loadSettings();
      fetchProducts();
      fetchOrders();
    };

    function switchTab(tab, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
      if(tab === 'rekap') calculateRekap();
    }

    function loadSettings() {
      document.getElementById('cfg-paper').value = localStorage.getItem('cfg_paper') || '80mm';
      document.getElementById('cfg-font').value = localStorage.getItem('cfg_font') || 'normal';
      document.getElementById('cfg-sender').value = localStorage.getItem('cfg_sender') || 'Munchkin Munch';
      document.getElementById('cfg-phone').value = localStorage.getItem('cfg_phone') || '';
      document.getElementById('cfg-footer').value = localStorage.getItem('cfg_footer') || 'Terima kasih telah berbelanja! 🍪';
    }

    function saveSettings() {
      localStorage.setItem('cfg_paper', document.getElementById('cfg-paper').value);
      localStorage.setItem('cfg_font', document.getElementById('cfg-font').value);
      localStorage.setItem('cfg_sender', document.getElementById('cfg-sender').value);
      localStorage.setItem('cfg_phone', document.getElementById('cfg-phone').value);
      localStorage.setItem('cfg_footer', document.getElementById('cfg-footer').value);
      alert('Settingan Thermal Berhasil Disimpan!');
    }

    async function fetchProducts() {
      const { data, error } = await supabase.from('products').select('*').order('name');
      if (!error) {
        productsData = data || [];
        renderStock();
      }
    }

    async function fetchOrders() {
      const { data, error } = await supabase.from('orders').select('*, products(name)').order('created_at', { ascending: false });
      if (!error) {
        ordersData = data || [];
        renderOrders();
        calculateRekap();
      }
    }

    function renderStock() {
      const container = document.getElementById('stock-list');
      container.innerHTML = productsData.length ? '' : '<p style="font-size:11px; color:#555;">Belum ada produk.</p>';
      productsData.forEach(p => {
        container.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1.5px dashed #000; font-size:12px;">
            <div><b>${p.name}</b><br><small style="color:#555">Rp${Number(p.price).toLocaleString('id-ID')}</small></div>
            <div style="display:flex; align-items:center; gap:6px;">
              <small style="font-weight:900;">STOK:</small>
              <input type="number" value="${p.stock}" onblur="updateStock('${p.id}', this.value)" style="width:55px; padding:4px; text-align:center; border:2px solid #000; border-radius:6px; font-weight:bold;">
            </div>
          </div>`;
      });
    }

    async function updateStock(id, newStock) {
      await supabase.from('products').update({ stock: parseInt(newStock) || 0 }).eq('id', id);
      fetchProducts();
    }

    async function addProduct() {
      const name = document.getElementById('new-name').value;
      const price = parseInt(document.getElementById('new-price').value) || 0;
      const stock = parseInt(document.getElementById('new-stock').value) || 0;
      if (!name || price <= 0) return alert('Isi nama & harga produk!');

      await supabase.from('products').insert([{ name, price, stock }]);
      document.getElementById('new-name').value = '';
      document.getElementById('new-price').value = '';
      document.getElementById('new-stock').value = '';
      fetchProducts();
      alert('Produk Berhasil Ditambah!');
    }

    function renderOrders() {
      const container = document.getElementById('orders-list');
      const filter = document.getElementById('filter-status').value;
      const list = filter === 'ALL' ? ordersData : ordersData.filter(o => o.status === filter);

      container.innerHTML = list.length ? '' : '<p style="font-size:11px; color:#555; text-align:center; padding:15px;">Tidak ada pesanan.</p>';

      list.forEach(o => {
        const isPaid = o.status === 'paid';
        const dateStr = new Date(o.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const prodName = o.products?.name || 'Produk Munchkin';

        container.innerHTML += `
          <div class="card-group" style="padding:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b>${o.customer_name}</b>
              <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${o.status}</span>
            </div>
            <div style="font-size:11px; color:#555; margin:4px 0 8px; font-weight:bold;">📅 ${dateStr} • 📱 WA: ${o.whatsapp}</div>
            <div style="background:#FAF9F5; border-radius:8px; padding:8px; font-size:12px; border:2px solid #000; margin-bottom:8px;">
              <div>📦 <b>${prodName}</b> (x${o.quantity})</div>
              <div>📍 ${o.address} (${o.postal_code || '-'})</div>
              <div style="font-weight:900; margin-top:4px; color:#000;">Total: Rp${Number(o.total_price).toLocaleString('id-ID')}</div>
            </div>
            <button class="btn btn-wa" onclick="sendWA('${o.id}', '${o.customer_name}', '${o.whatsapp}')">💬 1. Kirim Invoice WA</button>
            <div style="display:flex; gap:6px;">
              ${!isPaid ? `<button class="btn btn-green" onclick="setPaid('${o.id}', '${o.product_id}', ${o.quantity})">✅ 2. Set Paid</button>` : ''}
              <button class="btn btn-light" onclick="printLabel('${o.id}')">🖨️ Print Label</button>
            </div>
          </div>`;
      });
    }

    function sendWA(id, name, wa) {
      const invoiceUrl = `${window.location.href.replace('admin.html', 'index.html')}#invoice-${id}`;
      const text = `Halo Kak ${name},\n\nPesanan Kakak sudah kami terima! Silakan cek invoice di link ini:\n\n${invoiceUrl}\n\nTerima kasih!`;
      window.open(`https://wa.me/${wa.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(text)}`, '_blank');
    }

    async function setPaid(orderId, productId, qty) {
      await supabase.from('orders').update({ status: 'paid' }).eq('id', orderId);
      const prod = productsData.find(p => p.id === productId);
      if (prod) {
        await supabase.from('products').update({ stock: Math.max(0, prod.stock - qty) }).eq('id', productId);
      }
      await fetchProducts();
      await fetchOrders();
    }

    function printLabel(id) {
      const o = ordersData.find(i => i.id === id);
      if (!o) return;

      const is58 = (localStorage.getItem('cfg_paper') || '80mm') === '58mm';
      const isLarge = (localStorage.getItem('cfg_font') || 'normal') === 'large';
      const sender = localStorage.getItem('cfg_sender') || 'Munchkin Munch';
      const phone = localStorage.getItem('cfg_phone') || '';
      const footer = localStorage.getItem('cfg_footer') || 'Terima kasih telah berbelanja! 🍪';
      const prodName = o.products?.name || 'Produk Munchkin';

      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>Label - ${o.customer_name}</title>
        <style>
          @page { margin: 0; }
          body { font-family: monospace; width: ${is58 ? '54mm' : '76mm'}; margin: 0 auto; padding: 6px; font-size: ${isLarge ? '13px' : '11px'}; line-height: 1.2; }
          .box { border: 2px solid #000; padding: 6px; border-radius: 4px; }
          .header { text-align: center; border-bottom: 1.5px dashed #000; padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; }
          .sec { border-bottom: 1.5px dashed #000; padding-bottom: 4px; margin-bottom: 6px; }
          .addr { font-size: ${isLarge ? '14px' : '12px'}; font-weight: bold; margin-top: 2px; }
        </style></head><body>
        <div class="box">
          <div class="header">${sender}<br><small>PENGIRIM: ${sender} ${phone ? '('+phone+')' : ''}</small></div>
          <div class="sec">
            <small>PENERIMA:</small>
            <div style="font-size:13px; font-weight:bold;">${o.customer_name}</div>
            <div>WA: ${o.whatsapp}</div>
            <div class="addr">${o.address}</div>
            <div>Kode Pos: ${o.postal_code || '-'}</div>
          </div>
          <div class="sec">
            <div><b>ISI PAKET:</b> ${prodName} (x${o.quantity})</div>
            <div>STATUS: <b>${(o.status || 'PENDING').toUpperCase()}</b></div>
          </div>
          <div style="text-align:center; font-size:10px; font-style:italic;">${footer}</div>
        </div>
        <script>window.onload = () => { window.print(); setTimeout(() => window.close(), 500); };<\/script>
        </body></html>`);
      win.document.close();
    }

    function calculateRekap() {
      const filter = document.getElementById('rekap-filter').value;
      const now = new Date();
      let list = ordersData;

      if (filter === 'today') list = ordersData.filter(o => new Date(o.created_at).toDateString() === now.toDateString());
      else if (filter === 'week') list = ordersData.filter(o => new Date(o.created_at) >= new Date(now.getTime() - 7*24*60*60*1000));
      else if (filter === 'month') list = ordersData.filter(o => new Date(o.created_at) >= new Date(now.getTime() - 30*24*60*60*1000));

      const paid = list.filter(o => o.status === 'paid');
      const pending = list.filter(o => o.status === 'pending');
      const omset = paid.reduce((s, o) => s + Number(o.total_price || 0), 0);
      const items = paid.reduce((s, o) => s + Number(o.quantity || 0), 0);

      document.getElementById('m-omset').innerText = `Rp${omset.toLocaleString('id-ID')}`;
      document.getElementById('m-orders').innerText = paid.length;
      document.getElementById('m-items').innerText = `${items} pcs`;
      document.getElementById('m-pending').innerText = pending.length;
    }
  </script>
</body>
</html>
